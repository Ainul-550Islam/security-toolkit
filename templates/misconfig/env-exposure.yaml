id: misconfig-env-exposure
info:
  name: Exposed environment file
  severity: critical
  description: "The /.env file is publicly readable — it typically contains database credentials, API keys and application secrets."
  solution: "Move .env outside the web root and deny access to dot-files at the server layer. Rotate any credentials that were exposed."
  tags: misconfig,exposure,secrets
  reference: "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
requests:
  - method: GET
    path: "/.env"
    matchers:
      - type: regex
        part: body
        pattern: '(?i)((DB_|APP_|SECRET|PASS|KEY|TOKEN)[A-Z_]*\s*=|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)'
