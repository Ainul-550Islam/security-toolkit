id: info-gitlab-version
info:
  name: GitLab version disclosure
  severity: low
  description: "GitLab exposes its version in the sign-in page. Outdated versions are targeted by RCE chains (e.g. CVE-2023-2825, CVE-2023-7028 account takeover)."
  solution: "Update GitLab to the latest patch release; restrict sign-in page exposure via IP allowlist if public access is not required."
  tags: cve,gitlab,version
  reference: "https://about.gitlab.com/security/"
requests:
  - method: GET
    path: "/users/sign_in"
    extractors:
      - name: gitlab_version
        part: body
        regex: 'GitLab Community Edition ([0-9]+\.[0-9]+\.[0-9]+)'
    matchers:
      - type: version
        regex: "{{gitlab_version}}"
        comparison: lte
        version: "16.10.6"
