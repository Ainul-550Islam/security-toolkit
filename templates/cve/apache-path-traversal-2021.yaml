id: cve-2021-41773-apache
info:
  name: CVE-2021-41773 — Apache 2.4.49 path traversal / RCE
  severity: critical
  description: "Apache 2.4.49 allows path traversal (and RCE with mod_cgi enabled) via incorrect URL normalization."
  solution: "Upgrade to Apache 2.4.50 or later (ideally 2.4.51+). Immediately if 2.4.49 is detected."
  tags: cve,apache,version,rce
  reference: "https://nvd.nist.gov/vuln/detail/CVE-2021-41773"
requests:
  - method: GET
    path: "/"
    extractors:
      - name: apache_version
        part: header
        regex: 'Apache/([0-9]+\.[0-9]+\.[0-9]+)'
    matchers:
      - type: version
        regex: "{{apache_version}}"
        comparison: eq
        version: "2.4.49"
