[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-toolkit"
version = "0.1.0"
description = "Defensive security assessment and governance platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# AES-GCM is backed by pyca/cryptography rather than a local cipher. Pin its
# mandatory CFFI/pycparser dependency tree as well; rationale is in
# docs/SECURITY_MODEL.md.
dependencies = [
    "cryptography==50.0.2",
    "cffi==2.1.0",
    "pycparser==3.0",
]

[project.optional-dependencies]
# Development tooling only. Never installed in production images.
dev = [
    "mypy>=1.8",
    "ruff>=0.4",
]

# Cloud SDKs are opt-in and version-pinned; no provider connection is implied
# by a base install. Install only the adapter families actually deployed.
cloud-aws = ["boto3==1.43.108"]
cloud-azure = [
    "azure-identity==1.26.0",
    "azure-mgmt-resource==26.0.0",
]
cloud-gcp = [
    "google-auth==2.59.1",
    "google-cloud-asset==4.5.0",
]

[tool.setuptools]
# Explicit package list: automatic discovery would sweep up tests/ and the
# native/ trees.
packages = ["core", "config", "interfaces", "services", "api", "api.v1"]

[tool.mypy]
python_version = "3.11"
files = ["core", "config", "interfaces", "services", "api"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# The legacy python/ package predates these boundaries and is migrated
# incrementally; it is not type-checked yet.
[[tool.mypy.overrides]]
module = ["python.*"]
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["native", "build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "S",    # flake8-bandit: security checks
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert and construct deliberately bad inputs.
"tests/*" = ["S101", "S105", "S106", "S108"]
